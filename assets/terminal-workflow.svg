<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-label="system-explorer terminal workflow preview">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1018" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161f2e" />
      <stop offset="100%" stop-color="#1c273a" />
    </linearGradient>
  </defs>

  <rect width="880" height="540" rx="12" fill="url(#bgGrad)" stroke="#2b374b" stroke-width="1.5" />
  <rect width="880" height="40" rx="12" fill="url(#hdrGrad)" />
  <rect y="28" width="880" height="12" fill="url(#hdrGrad)" />
  <line x1="0" y1="40" x2="880" y2="40" stroke="#2b374b" stroke-width="1" />

  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" />

  <text x="440" y="24" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, 'Cascadia Code', monospace" font-size="13" font-weight="600">
    system-explorer v0.4.2 — Local-First Cartography &amp; Drift CLI (127.0.0.1 / Zero-Egress)
  </text>

  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="12.5">
    <text x="24" y="72" fill="#66d9c1">$ system-explorer doctor --config examples/self-scan.json</text>
    <text x="24" y="92" fill="#94a3b8">{ "schema": "system-explorer.config.v1", "database_writable": true, "raw_content_storage": false }</text>

    <text x="24" y="124" fill="#66d9c1">$ system-explorer ingest --config examples/self-scan.json --time-budget-seconds 300</text>
    <text x="24" y="144" fill="#e2e8f0">"scan": { "files": 81, "directories": 17, "evidence": 81, "nodes": 818, "edges": 824, "errors": 0 }</text>
    <text x="24" y="162" fill="#7dd3fc">"desired": { "functions": 2, "carriers": 2, "coverage": 2 }  # URIs &amp; SHA-256 digests only</text>

    <text x="24" y="194" fill="#66d9c1">$ system-explorer coverage --config examples/self-scan.json</text>
    <text x="24" y="214" fill="#e2e8f0">"discovery_summary": { "functions": 37, "carrier_nodes": 4, "verdicts": { "partial": 36, "negative": 1 } }</text>
    <text x="24" y="232" fill="#fbbf24">"desired_summary":   { "functions": 2, "hard_gaps": 0, "unclassified_gaps": 2, "carrier_mismatches": 0 }</text>

    <text x="24" y="264" fill="#66d9c1">$ system-explorer software-endpoints --config examples/software-resources.json --refresh</text>
    <text x="24" y="284" fill="#a7f3d0">{"schema": "system-explorer.software-endpoint-registry.v1", "redacted_credentials": true, "content_hash": "sha256:..."}</text>

    <text x="24" y="316" fill="#66d9c1">$ system-explorer system-resolve instance.v1.json --catalog bundles.catalog.v1.json</text>
    <text x="24" y="336" fill="#34d399">[GATE PASS] Authority receipts verified (Ed25519 key-pin + SQLite evidence match)</text>
    <text x="24" y="354" fill="#f87171">[FAIL-CLOSED] Missing authority or hash drift -&gt; blocked-evidence-only (0 target mutations)</text>

    <text x="24" y="386" fill="#66d9c1">$ system-explorer serve --config examples/self-scan.json</text>
    <text x="24" y="406" fill="#93c5fd">Listening on http://127.0.0.1:8765 (Loopback only · RunAsInvoker · 40 nodes, 39 edges)</text>
  </g>

  <rect x="24" y="432" width="832" height="84" rx="8" fill="#141d2b" stroke="#283548" stroke-width="1" />
  <text x="40" y="458" fill="#66d9c1" font-family="Consolas, 'Cascadia Code', monospace" font-size="12" font-weight="700">
    RUNTIME INVARIANTS (INV-LOCAL-01 .. INV-SLA-10)
  </text>
  <text x="40" y="480" fill="#cbd5e1" font-family="Consolas, 'Cascadia Code', monospace" font-size="11.5">
    • 100% Local-First / Zero-Egress: raw prompts and secrets never stored; loopback 127.0.0.1 only
  </text>
  <text x="40" y="500" fill="#cbd5e1" font-family="Consolas, 'Cascadia Code', monospace" font-size="11.5">
    • Fail-Closed &amp; Read-Only Proposals: Ed25519 receipt pins, bounded timeouts, MIT / § 521 BGB
  </text>
</svg>
