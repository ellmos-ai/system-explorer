[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-explorer"
version = "0.4.2"
description = "Evidence-backed system maps for functions, carriers, entry points, and architecture drift."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Lukas Geiger", email = "lukas@open-bricks.org" }]
keywords = [
    "architecture-drift",
    "entrypoints",
    "evidence-based",
    "local-first",
    "python",
    "static-analysis",
    "system-mapping",
    "ai-agents",
    "antigravity",
    "claude-code",
    "cli",
    "codebase-index",
    "codex",
    "developer-tools",
    "fail-closed",
    "multi-agent",
    "open-bricks",
    "provenance",
    "zero-egress",
    "runtime-invariants"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: Security"
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "jsonschema>=4.0", "fastapi>=0.100", "httpx>=0.24"]
gui = ["fastapi>=0.100", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/system-explorer"
Documentation = "https://github.com/ellmos-ai/system-explorer#readme"
Repository = "https://github.com/ellmos-ai/system-explorer.git"
"Bug Tracker" = "https://github.com/ellmos-ai/system-explorer/issues"
Changelog = "https://github.com/ellmos-ai/system-explorer/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/system-explorer/blob/main/SECURITY.md"
Notice = "https://github.com/ellmos-ai/system-explorer/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/ellmos-ai/system-explorer/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/system-explorer/blob/main/THIRD_PARTY_LICENSES.txt"
"Marketing-Log" = "https://github.com/ellmos-ai/system-explorer/blob/main/MARKETING-LOG.txt"
"LLM-Ready" = "https://github.com/ellmos-ai/system-explorer/blob/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
system-explorer = "system_explorer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
system_explorer = ["web/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".git", ".pytest_temp", ".pytest_tmp*", ".hypothesis", ".turbo", ".nyc_output", ".tox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
