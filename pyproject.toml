[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-explorer"
version = "0.4.0"
description = "Evidence-backed system maps for functions, carriers, entry points, and architecture drift."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lukas Geiger" }]
dependencies = []

[project.scripts]
system-explorer = "system_explorer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
system_explorer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
