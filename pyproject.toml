[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-explorer"
version = "0.4.0"
description = "Evidence-backed system maps for functions, carriers, entry points, and architecture drift."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lukas Geiger", email = "lukas@open-bricks.org" }]
keywords = [
    "ellmos",
    "system-explorer",
    "architecture",
    "drift-detection",
    "system-mapping",
    "evidence-based",
    "local-first",
    "ai-governance",
    "function-carrier"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration"
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/system-explorer"
Documentation = "https://github.com/ellmos-ai/system-explorer#readme"
Repository = "https://github.com/ellmos-ai/system-explorer.git"
"Bug Tracker" = "https://github.com/ellmos-ai/system-explorer/issues"
Changelog = "https://github.com/ellmos-ai/system-explorer/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/system-explorer/blob/main/SECURITY.md"

[project.scripts]
system-explorer = "system_explorer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
system_explorer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
