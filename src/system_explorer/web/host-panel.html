<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>System Explorer · Read-only</title>
  <style>
    :root{color-scheme:dark;--ink:#e8edf5;--muted:#9aa8ba;--panel:#151b26;--line:#344153;--accent:#66d9c1}
    *{box-sizing:border-box}body{margin:0;background:#0b0f16;color:var(--ink);font:14px Inter,Segoe UI,sans-serif}
    header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #273141;background:#101620}
    h1{font-size:16px;margin:0;letter-spacing:.04em}.tag{color:var(--muted);font-size:12px}.count{margin-left:auto;color:var(--muted)}
    main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 58px)}
    .canvas{overflow:auto;padding:20px}.side{border-left:1px solid #273141;background:var(--panel);padding:18px;overflow:auto}
    .toolbar{display:flex;gap:9px;align-items:center;margin-bottom:16px}button,select{background:#202938;color:var(--ink);border:1px solid #3b485b;border-radius:7px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--accent)}
    .lanes{display:grid;grid-template-columns:1fr 1fr;gap:70px;position:relative;min-width:760px}.lane h2{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.13em}
    .node{position:relative;margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-left:5px solid #768397;border-radius:7px;background:#151d29}
    .node small{display:block;margin-top:7px;color:var(--muted);font-size:10px;line-height:1.45}.node.function{border-left-color:#45b58c}.node.carrier{border-left-color:#5d8ee7}
    .node.full{box-shadow:inset 0 0 0 1px #2f865e}.node.partial{box-shadow:inset 0 0 0 1px #b88a2e}.node.uncovered{box-shadow:inset 0 0 0 1px #b94a55}
    pre{white-space:pre-wrap;word-break:break-word;background:#0d121a;padding:12px;border-radius:7px;border:1px solid #293344;max-height:360px;overflow:auto}
    @media(max-width:850px){main{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #273141}.lanes{min-width:0;grid-template-columns:1fr;gap:20px}}
  </style>
</head>
<body>
<header><h1>SYSTEM EXPLORER</h1><span class="tag">eingebettet · read-only</span><span class="count" id="count"></span></header>
<main>
  <section class="canvas">
    <div class="toolbar">
      <label>Ansicht <select id="view"><option>coverage</option><option>function-paths</option><option>resources</option><option>control</option><option>tree</option><option>data</option><option>deployment</option><option>purpose</option><option>llm-traces</option><option>llm-actions</option><option>federation</option><option>diff</option><option>actual</option><option>desired</option></select></label>
      <label>Systemebene <select id="system"><option value="all">Alle Systeme</option></select></label>
      <button id="reload">Neu laden</button>
    </div>
    <div class="lanes"><div class="lane"><h2 id="left-title">Funktionsträger</h2><div id="carriers"></div></div><div class="lane"><h2 id="right-title">Funktionen im Gesamtsystem</h2><div id="functions"></div></div></div>
  </section>
  <aside class="side"><h2>Beleg / Beziehung</h2><pre id="details">Knoten auswählen.</pre><h2>Host-Vertrag</h2><pre id="status">Wird gelesen …</pre></aside>
</main>
<script>
const $=id=>document.getElementById(id);
const titles={data:['Datenquellen und Akteure','Tabellen, Cloud und Credentials'],deployment:['Server, Anbieter und Kosten','Oberflächen, Schutz und Belege'],purpose:['Funktionsträger','Zwecke und Kriterien'],federation:['Systemebenen','Verbindungen, Übergaben und Kartenknoten'],'llm-traces':['LLMs und Sessions','Genutzte Tools, Entrypoints und Artefakte'],'llm-actions':['LLMs und erreichbare Systeme','CLI-, API-, Tool- und Übergabewege'],'function-paths':['Entrypoints, Akteure und Träger','Funktionen, Outputs und Übergaben'],resources:['Kristallisierte Randressourcen','Funktionen und LLM-Schnittstellen'],control:['Steuer-/Einstiegsknoten','Ziele und Abhängigkeiten'],tree:['Systeme und Verzeichnisse','Dokumente und Einstiegspunkte']};
async function load(){const g=await fetch('api/map?view='+encodeURIComponent($('view').value)+'&system='+encodeURIComponent($('system').value)).then(r=>r.json());$('carriers').replaceChildren();$('functions').replaceChildren();const nodes=Object.fromEntries((g.nodes||[]).map(n=>[n.id,n]));const view=$('view').value;const structural=['control','tree','data','deployment','purpose','federation','llm-traces','llm-actions','function-paths','resources'].includes(view);const laneTitles=titles[view]||['Funktionsträger','Funktionen im Gesamtsystem'];$('left-title').textContent=laneTitles[0];$('right-title').textContent=laneTitles[1];for(const n of g.nodes||[]){const relations=(g.edges||[]).filter(e=>e.source_id===n.id||e.target_id===n.id);const actual=relations.filter(e=>e.source_id===n.id&&e.mode==='actual');const worst=actual.some(e=>['negative','contradicted'].includes(e.status))?'negative':actual.some(e=>e.status==='partial')?'partial':'';const el=document.createElement('div');const v=n.metadata?.coverage_verdict||n.metadata?.purpose_verdict||worst;el.className='node '+n.node_type+' '+v;el.textContent=n.name;if(n.node_type!=='function'&&relations.length){const sub=document.createElement('small');sub.textContent=relations.map(e=>{const outgoing=e.source_id===n.id,other=outgoing?e.target_id:e.source_id;return `${e.mode==='desired'?'SOLL':'IST'} ${e.relation.toUpperCase()} ${outgoing?'→':'←'} ${nodes[other]?.name||other} [${e.status}]`}).join(' · ');el.appendChild(sub)}el.onclick=()=>show({node:n,relations});const leftByView={data:['registry','database','data_actor','entrypoint'],deployment:['server','cloud_provider','cost_offer'],purpose:['carrier','server','repository'],federation:['system_instance'],'llm-traces':['actor','session'],'llm-actions':['actor','system_instance'],'function-paths':['entrypoint','actor','carrier','system_instance'],resources:['software_resource','carrier','actor'],control:['system','directory','control_document','entrypoint'],tree:['system','directory']};const leftTypes=leftByView[view]||['carrier','control_document','entrypoint','directory','system'];((structural&&!leftTypes.includes(n.node_type))||(!structural&&n.node_type==='function')?$('functions'):$('carriers')).appendChild(el)}$('count').textContent=`${g.nodes?.length||0} Knoten · ${g.edges?.length||0} Beziehungen`}
function show(v){$('details').textContent=JSON.stringify(v,null,2)}
async function loadLevels(){const g=await fetch('api/map?view=federation').then(r=>r.json());const s=$('system'),current=s.value;for(const level of g.levels||[]){if([...s.options].some(o=>o.value===level.id))continue;const o=document.createElement('option');o.value=level.id;o.textContent=level.label||level.id;s.appendChild(o)}s.value=current}
async function loadStatus(){$('status').textContent=JSON.stringify(await fetch('api/status').then(r=>r.json()),null,2)}
$('reload').onclick=load;$('view').onchange=load;$('system').onchange=load;loadLevels();loadStatus();load();
</script>
</body>
</html>
